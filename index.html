<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Practice</title>
    <!-- bootstrap.min.css  5.3.8 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- bootstrap-icons.min.css 1.13.1 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
      integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- style.css -->
    <link rel="stylesheet" href="css/style.css" />
    <link media="screen and (max-width: 768px)" rel="stylesheet" href="css/mobile.css">
  </head>
  <body>
    <div class="container">
      <h4 class="my-2 py-2 text-center text-bg-primary display-5">Quiz App</h4>

      <!-- .quiz-app-container -->
      <div class="quiz-app-container py-3">
        <!-- #question -->
        <div id="question" class="card my-2">
          <div class="card-header question-header">
            <h4>Quiz App</h4>
          </div>
          <div class="card-body question-body">
            <!-- static part for startQuizStaticly() on app.js -->
            <!-- <div class="body">
                <div class="question-text"></div>
                <div class="question-options">
                  <ul>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                  </ul>
                </div>
              </div> -->
          </div>
          <div
            class="card-footer d-flex justify-content-between align-items-center"
          >
            <span class="badge text-bg-info question-progress">
              <!-- dynamic -->
            </span>
            <div>
              <button class="btn btn-warning" id="get-question-btn">
                <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>
        </div>
        <!-- #score -->
        <id id="score" class="card my-2">
          <div class="card-body score-box text-center">
            <div class="mb-3">
              <!-- icon -->
              <i class="bi bi-trophy icon text-primary"></i>
            </div>
            <div>
              <div class="score-text mb-3 passive">
                <p class="lead">
                  <h5>
                    <!-- dynamic -->
                  </h5>
                </p>
              </div>
              <div class="score-buttons mb-3">
                <button class="btn btn-primary passive replay">Replay</button>
                <button class="btn btn-primary start active">Start Quiz</button>
                <button class="btn btn-primary passive quit">Quit</button>
              </div>
            </div>
          </div>
        </id>
      </div>
    </div>
    <!-- SCRIPTS -->
    <!-- question.js -->
    <script src="js/question.js"></script>
    <!-- quiz.js -->
    <script src="js/quiz.js"></script>
    <!-- data.js -->
    <script src="js/data.js"></script>
    <!-- ui.js -->
    <script src="js/ui.js"></script>
    <!-- app.js -->
    <script src="js/app.js"></script>
    <!-- bootstrap bundle.min.js 5.3.8 -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
      integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
